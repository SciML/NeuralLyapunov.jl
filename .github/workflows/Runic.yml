name: Runic Formatting

on:
  push:
    branches:
      - master
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  runic:
    name: Runic Formatting Check
    uses: "SciML/.github/.github/workflows/runic.yml@v1"
    secrets: "inherit"
